services:
  sharelatex:
    image: sharelatex/sharelatex:6.2.2
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
    environment:
      OVERLEAF_APP_NAME: LeafRelay Integration Test
      OVERLEAF_SITE_URL: http://localhost:8080
      OVERLEAF_MONGO_URL: mongodb://mongo/sharelatex
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_INVITE_TOKEN_SECRET: leafrelay-ci-invite-token-secret
      EMAIL_CONFIRMATION_DISABLED: "true"
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file

  mongo:
    image: mongo:8.0
    command: --replSet overleaf
    environment:
      MONGO_INITDB_DATABASE: sharelatex
    extra_hosts:
      - "mongo:127.0.0.1"
    healthcheck:
      test: >-
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'overleaf',members:[{_id:0,host:'mongo:27017'}]}) }"
        | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:6.2
