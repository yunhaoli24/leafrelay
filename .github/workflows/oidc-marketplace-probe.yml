name: Marketplace OIDC Probe

on:
  push:
    branches:
      - codex/oidc-marketplace-publishing

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package extension
        run: pnpm exec vsce package --no-dependencies --out leafrelay-0.1.2.vsix

      - name: Publish through Marketplace OIDC
        run: pnpm exec vsce publish --packagePath leafrelay-0.1.2.vsix --oidc --skip-duplicate
