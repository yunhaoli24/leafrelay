name: Package Extension

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: pnpm test

      - name: Verify Extension Host activation
        run: xvfb-run -a pnpm test:extension

      - name: Start Overleaf Community Edition
        run: docker compose -f test/integration/docker-compose.yml up -d

      - name: Wait for Overleaf and verify HTTP integration
        run: |
          for attempt in $(seq 1 90); do
            if ! docker compose -f test/integration/docker-compose.yml ps --status running --services | grep -qx sharelatex; then
              echo "ShareLaTeX stopped before becoming ready."
              docker compose -f test/integration/docker-compose.yml ps
              exit 1
            fi
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/login >/dev/null; then
              pnpm test:overleaf
              exit $?
            fi
            sleep 5
          done
          exit 1

      - name: Show Overleaf logs after failure
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs

      - name: Stop Overleaf Community Edition
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

      - name: Package extension
        run: |
          npm pack ./packages/cli --dry-run
          pnpm --dir apps/vscode exec vsce package \
            --no-dependencies \
            --out ../../leafrelay-pr-${{ github.event.number }}-${{ github.sha }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: leafrelay-pr-${{ github.event.number }}
          path: leafrelay-pr-${{ github.event.number }}-${{ github.sha }}.vsix
