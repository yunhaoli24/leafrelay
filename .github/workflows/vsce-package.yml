name: Package Extension

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix views/chat-view ci

      - name: Verify extension
        run: |
          npm run compile
          npm run lint

      - name: Package extension
        run: npx @vscode/vsce package --out leafrelay-pr-${{ github.event.number }}-${{ github.sha }}.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafrelay-pr-${{ github.event.number }}
          path: leafrelay-pr-${{ github.event.number }}-${{ github.sha }}.vsix
