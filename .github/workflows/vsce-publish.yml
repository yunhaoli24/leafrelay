name: Publish Extension

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the packaged VSIX to the VS Code Marketplace
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix views/chat-view ci

      - name: Verify extension
        run: |
          npm run compile
          npm run lint

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="leafrelay-${VERSION}.vsix"
          npx @vscode/vsce package --out "$VSIX"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already released
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.package.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.package.outputs.tag }} already exists; bump package.json before merging." >&2
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: leafrelay-${{ github.ref_name }}
          path: ${{ steps.package.outputs.vsix }}

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath "${{ steps.package.outputs.vsix }}" --pat "$VSCE_PAT"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.vsix }}" \
            --target "$GITHUB_SHA" \
            --title "LeafRelay ${{ steps.package.outputs.tag }}" \
            --generate-notes
