name: Publish Extension

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: Publish the packaged VSIX to the VS Code Marketplace
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: pnpm test

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="leafrelay-${VERSION}.vsix"
          pnpm exec vsce package --no-dependencies --out "$VSIX"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already released
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.package.outputs.tag }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.package.outputs.tag }} already exists; bump package.json before merging." >&2
            exit 1
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: leafrelay-${{ github.ref_name }}
          path: ${{ steps.package.outputs.vsix }}

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.vsix }}" \
            --target "$GITHUB_SHA" \
            --title "LeafRelay ${{ steps.package.outputs.tag }}" \
            --generate-notes

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || inputs.publish_marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not configured; the VSIX is available from the GitHub Release and can be published later."
            exit 0
          fi
          pnpm exec vsce publish --packagePath "${{ steps.package.outputs.vsix }}" --pat "$VSCE_PAT"
