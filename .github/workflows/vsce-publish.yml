name: Publish Extension

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Existing release tag to publish or retry
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: Release tag created by Release Please
        required: true
        type: string
    secrets:
      VSCE_PAT:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: pnpm test

      - name: Verify Extension Host activation
        run: xvfb-run -a pnpm test:extension

      - name: Start Overleaf Community Edition
        run: docker compose -f test/integration/docker-compose.yml up -d

      - name: Wait for Overleaf and verify HTTP integration
        run: |
          for attempt in $(seq 1 90); do
            if pnpm test:overleaf; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Show Overleaf logs after failure
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs

      - name: Stop Overleaf Community Edition
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="leafrelay-${VERSION}.vsix"
          pnpm exec vsce package --no-dependencies --out "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_TAG="${{ steps.package.outputs.tag }}"
          RELEASE_REF="${{ inputs.ref || github.ref_name }}"
          if [ "$RELEASE_REF" != "$EXPECTED_TAG" ]; then
            echo "Release ref $RELEASE_REF does not match package.json version $EXPECTED_TAG." >&2
            exit 1
          fi

          if gh release view "$EXPECTED_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: leafrelay-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.vsix }}
            ${{ steps.package.outputs.vsix }}.sha256

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --target "${{ steps.package.outputs.commit }}" \
            --title "LeafRelay ${{ steps.package.outputs.tag }}" \
            --generate-notes

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.vsix }}" \
            "${{ steps.package.outputs.vsix }}.sha256" \
            --clobber

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::warning::VSCE_PAT is not configured; the VSIX is available from the GitHub Release and can be published later."
            exit 0
          fi
          pnpm exec vsce publish \
            --packagePath "${{ steps.package.outputs.vsix }}" \
            --pat "$VSCE_PAT" \
            --skip-duplicate
