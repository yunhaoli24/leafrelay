name: Publish Extension

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      ref:
        description: Release tag created by Release Please
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension
        run: pnpm test

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="leafrelay-${VERSION}.vsix"
          pnpm exec vsce package --no-dependencies --out "$VSIX"
          sha256sum "$VSIX" > "$VSIX.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED_TAG="${{ steps.package.outputs.tag }}"
          RELEASE_REF="${{ inputs.ref || github.ref_name }}"
          if [ "$RELEASE_REF" != "$EXPECTED_TAG" ]; then
            echo "Release ref $RELEASE_REF does not match package.json version $EXPECTED_TAG." >&2
            exit 1
          fi

          if gh release view "$EXPECTED_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: leafrelay-${{ steps.package.outputs.version }}
          path: |
            ${{ steps.package.outputs.vsix }}
            ${{ steps.package.outputs.vsix }}.sha256

      - name: Create GitHub Release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --target "${{ steps.package.outputs.commit }}" \
            --title "LeafRelay ${{ steps.package.outputs.tag }}" \
            --generate-notes

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.vsix }}" \
            "${{ steps.package.outputs.vsix }}.sha256" \
            --clobber

      - name: Publish to VS Code Marketplace
        if: vars.MARKETPLACE_OIDC_ENABLED == 'true'
        run: |
          pnpm exec vsce publish \
            --packagePath "${{ steps.package.outputs.vsix }}" \
            --oidc \
            --skip-duplicate

      - name: Report deferred Marketplace publishing
        if: vars.MARKETPLACE_OIDC_ENABLED != 'true'
        run: |
          echo "::warning::Marketplace OIDC publishing is not enabled. The VSIX remains available from the GitHub Release."
